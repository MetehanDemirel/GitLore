name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        exclude:
          # Upstream's llama-cpp-python 0.3.19 cp313 macOS wheel is a malformed ZIP that uv rejects.
          # The launcher always uses Python 3.12, so users are unaffected (see SETUP.md).
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-minilm
      # Failures are also copied into an annotation, which is readable without signing in.
      - name: Install dependencies
        shell: bash
        run: |
          set +e  # Actions runs bash with -e -o pipefail; keep going to report the failure
          extra=()
          # Same as start.sh: the prebuilt Linux wheel is musl-only, so build llama-cpp-python from source.
          [ "$RUNNER_OS" = "Linux" ] && extra=(--no-binary llama-cpp-python --index-strategy unsafe-best-match)
          uv pip install "${extra[@]}" -r requirements-dev.txt 2>&1 | tee install.log
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] || python .github/annotate.py "Install failed" install.log
          exit "$status"
      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest -q -rfEs --tb=short --ignore=tests/e2e 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] || python .github/annotate.py "Tests failed" pytest.log
          exit "$status"

  launcher:
    # Runs the real one-click launcher like a new user would, then checks the app answers HTTP.
    name: Launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest   # no uv: exercises the plain Python + pip fallback
            uv: false
          - os: macos-latest
            uv: true
          - os: windows-latest
            uv: true
    env:
      GITLORE_NO_BROWSER: "1"
      GITLORE_NO_AUTO_SHUTDOWN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        if: matrix.uv
      - name: Start (macOS / Linux)
        if: runner.os != 'Windows'
        run: nohup ./start.sh > launcher.log 2>&1 &
      - name: Start (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Start-Process cmd -ArgumentList '/c', 'start.bat > launcher.log 2>&1' -WindowStyle Hidden
      - name: Wait for the app to respond
        shell: bash
        run: |
          for i in $(seq 1 180); do
            if curl -fs http://127.0.0.1:8501/_stcore/health; then echo " — up after $((i * 5))s"; exit 0; fi
            sleep 5
          done
          echo "App did not start within 15 minutes"; exit 1
      - name: Launcher log
        if: always()
        shell: bash
        run: cat launcher.log || true
